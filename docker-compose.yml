x-backend-env: &backend-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-kelontong}:${POSTGRES_PASSWORD:-kelontong}@db:5432/${POSTGRES_DB:-kelontong}?schema=public
  PORT: 3001
  NODE_ENV: ${NODE_ENV:-development}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-me-32chars}
  JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me-32chars}
  JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kelontong}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kelontong}
      POSTGRES_DB: ${POSTGRES_DB:-kelontong}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/01-test-db.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-kelontong} -d ${POSTGRES_DB:-kelontong}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

