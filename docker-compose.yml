services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kelontong}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kelontong}
      POSTGRES_DB: ${POSTGRES_DB:-kelontong}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/01-test-db.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-kelontong} -d ${POSTGRES_DB:-kelontong}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
