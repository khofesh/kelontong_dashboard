name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: klontong
          POSTGRES_PASSWORD: klontong
          POSTGRES_DB: klontong_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U klontong -d klontong_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://klontong:klontong@localhost:5432/klontong_test?schema=public
      NODE_ENV: test
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters
      COOKIE_SECURE: "false"
      FRONTEND_ORIGIN: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter backend prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # - name: Unit tests
      #   run: pnpm test

      - name: Apply migrations to the test database
        run: pnpm --filter backend exec prisma migrate deploy

      # - name: Backend e2e tests
      #   run: pnpm test:e2e

      - name: Build
        run: pnpm build
